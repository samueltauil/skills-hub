name: Enrich Skills

on:
  workflow_dispatch:
    inputs:
      enrich:
        description: 'Run AI enrichment (requires Copilot CLI)'
        type: boolean
        default: false
      force:
        description: 'Re-enrich already-enriched skills'
        type: boolean
        default: false
      limit:
        description: 'Max skills to enrich (0 = all pending)'
        type: string
        default: '10'

permissions:
  contents: write
  pull-requests: write

jobs:
  enrich:
    name: AI Enrichment
    runs-on: ubuntu-latest
    # Only run enrichment when explicitly requested via workflow_dispatch
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.enrich == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install GitHub Copilot CLI extension
        run: |
          gh extension install github/gh-copilot 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run enrichment
        id: enrich
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            FORCE_FLAG="--force"
          fi
          LIMIT="${{ github.event.inputs.limit }}"
          node scripts/enrich-skills.js $FORCE_FLAG --limit "$LIMIT" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild and validate plugins
        run: |
          node scripts/build-plugins.js
          node scripts/validate-plugins.js

      - name: Commit enrichment results
        id: enrich-commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add site/src/data/skills.json plugins .github/plugin
          if git diff --cached --quiet; then
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: enrich skill metadata via Copilot SDK"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger deploy after enrichment
        if: steps.enrich-commit.outputs.pushed == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enrichment summary
        run: |
          echo "## 🤖 AI Enrichment Results" >> $GITHUB_STEP_SUMMARY
          ENRICHED=$(node -e "const d=require('./site/src/data/skills.json'); console.log(d.skills.filter(s=>s.enrichedAt).length)")
          TOTAL=$(node -e "const d=require('./site/src/data/skills.json'); console.log(d.skills.length)")
          echo "- **Total skills:** $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "- **Enriched skills:** $ENRICHED" >> $GITHUB_STEP_SUMMARY
